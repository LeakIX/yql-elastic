name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/checkout/blob/11d5960a326750d5838078e36cf38b85af677262/README.md#v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The changelog check verifies that every commit referenced in
          # CHANGELOG.md exists, which requires the full history.
          fetch-depth: 0

      # https://github.com/actions/setup-go/blob/40f1582b2485089dde7abd97c1529aa768e1baff/README.md#v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: gofmt
        run: make check-format

      - name: go vet
        run: make vet

      - name: test
        run: make test

      - name: govulncheck
        run: make vuln

      - name: golangci-lint
        run: make lint

      - name: changelog
        run: make check-changelog

      # https://github.com/zizmorcore/zizmor-action/blob/6fc4b006235f201fdab3722e17240ab420d580e5/README.md
      - name: zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}